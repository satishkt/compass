[project]
name = "self-learning-knowledge-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "databricks-sdk>=0.133",
    "psycopg[binary]>=3.2,<4",
    "mlflow-tracing>=3.8,<4",
    "mcp>=1.26,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50"]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
